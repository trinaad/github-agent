@if (!auth.isLoggedIn()) {
<button class="login-btn" (click)="auth.login()">
    Login with GitHub
</button>
} @else {
<div class="user-info">
    <span class="status">✅ Logged in as <strong>{{ username() }}</strong></span>
    <button class="logout-btn" (click)="onLogout()">Logout</button>
</div>
}
